# LABRE-Pay — ambiente local de desenvolvimento/testes
#   docker compose up -d
#   Sistema:    http://localhost:8080  (instalador na primeira vez)
#   Emails:     http://localhost:8025  (Mailpit captura tudo — nada sai para a internet)
#   phpMyAdmin: http://localhost:8081

services:
  app:
    build: ./docker
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./app:/var/www/app
      - ./tests:/var/www/tests:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      LABREPAY_DOCKER: "1"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: labrepay
      MYSQL_USER: labrepay
      MYSQL_PASSWORD: labrepay
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 força TCP: o socket responde cedo demais durante a
      # inicialização do MySQL 8 e liberaria o app antes da hora
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulabrepay", "-plabrepay"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # interface web
      # SMTP interno na 1025 — o app alcança via hostname "mailpit"

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: labrepay
      PMA_PASSWORD: labrepay

volumes:
  db-data:
