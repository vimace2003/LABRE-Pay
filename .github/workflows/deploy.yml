# LABRE-Pay — CI/CD para cPanel
#
# Branches → ambientes:
#   main    → environment "production"  (produção)
#   homolog → environment "homolog"     (homologação)
#
# Secrets por environment (Settings → Environments no GitHub):
#   FTP_SERVER    ex.: ftp.labre-sc.org.br
#   FTP_USERNAME  usuário FTP/cPanel do deploy
#   FTP_PASSWORD  senha
#   FTP_DIR       pasta remota, ex.: /public_html/pay/   (termina com /)
#
# Método padrão: FTPS incremental (funciona em qualquer cPanel).
# Se a hospedagem oferecer SSH, prefira o job "deploy-ssh" (comentado no fim).

name: Deploy cPanel

on:
  push:
    branches: [main, homolog]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint de sintaxe em todos os PHP
        run: |
          erros=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || erros=1
          done < <(find app public -name '*.php' -print0)
          exit $erros

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Subir ambiente (app + MySQL + Mailpit)
        run: docker compose up -d --build
      - name: Aguardar o app responder
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/index.php || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then exit 0; fi
            sleep 3
          done
          echo "App não subiu a tempo"
          docker compose logs app | tail -50
          exit 1
      - name: Rodar testes E2E
        run: docker compose exec -T app php /var/www/tests/e2e.php

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v5
      - name: Enviar via FTPS (incremental)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          state-name: .ftp-deploy-state.json
          exclude: |
            **/.git*
            **/.git*/**
            docker/**
            docker-compose.yml
            docs/**
            tests/**
            app/config.php
            app/config.sample.php
            app/install.lock
            app/backups/**
            app/import-*.json
            public/assets/uploads/**
            ESCOPO.md
            README.md

  # ------------------------------------------------------------------
  # Alternativa (melhor prática se a hospedagem tiver SSH): rsync + chave
  # dedicada de deploy. Descomente, crie o secret SSH_PRIVATE_KEY e os
  # demais, e remova o job FTPS acima.
